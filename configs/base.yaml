# Single source of truth for hyperparameters (GEMINI.md §8).
# Everything tunable lives here — nothing hardcoded in Python.
seed: 0
deterministic: false

hardware:
  device: cuda          # cuda | cpu
  max_vram_gb: 5.0      # soft ceiling for the RTX 3050 (GEMINI.md §2)

env:
  name: simple_spread
  n_parallel_envs: 8    # reduce if OOM
  episode_length: 25

model:
  hidden_dim: 64
  num_layers: 2

train:
  total_steps: 1000000
  n_steps: 128          # rollout horizon per env
  batch_size: 1024      # mini-batch size (reduce if OOM)
  n_epochs: 10          # PPO optimization epochs per rollout
  actor_lr: 0.0005
  critic_lr: 0.0005
  gamma: 0.99
  gae_lambda: 0.95
  clip_param: 0.2
  value_loss_coef: 0.5
  entropy_coef: 0.01
  grad_clip: 10.0
  checkpoint_every_steps: 20000
  checkpoint_every_minutes: 15
  log_interval_steps: 1000

defense:
  name: none            # none | grad_penalty
  penalty_coeff: 0.0

attack:
  name: none            # none | critic_sensitivity
  budget_fraction: 0.0  # fraction of timesteps allowed to perturb
  epsilon: 0.0          # L-inf radius
