[project]
name = "admarl"
version = "0.0.1"
description = "Lipschitz-regularized critics vs. budget-constrained attacks in cooperative MARL"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pettingzoo>=1.25",
    "mpe2",
    "pyyaml",
    "hydra-core",
    "tensorboard",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/admarl"]
